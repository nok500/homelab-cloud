---
# Garage S3 on the Mac Pro host, outside the lab (ADR 0010). Deployed by scripts/garage-deploy.sh (make garage)
# to ~/homelab-garage on the host; `make destroy` never touches it.
#   garage  single node, S3 API only on the internal network; admin + RPC never published
#   caddy   TLS for https://s3.lab.macpro:3900 (S3) and :3909 (UI), cert signed offline by the lab intermediate CA
#   garage-ui  web UI (noooste/garage-ui), only reachable through caddy
# restart: unless-stopped + the systemd-managed Docker daemon bring both back after a host boot.
name: homelab-garage

services:
  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - meta:/var/lib/garage/meta
      - data:/var/lib/garage/data
    networks: [garage]
    mem_limit: 512m
    stop_grace_period: 30s

  caddy:
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    depends_on: [garage]
    ports:
      - "${GARAGE_BIND_IP:-192.168.8.207}:3900:3900"   # S3 API
      - "${GARAGE_BIND_IP:-192.168.8.207}:3909:3909"   # Garage UI
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/tls:ro
    networks: [garage]
    mem_limit: 128m

  # Web UI for buckets, keys, objects and the layout. Holds the admin token, so: its own login (admin user,
  # password in SOPS), no published port (only via Caddy's TLS on :3909), LAN address only.
  garage-ui:
    image: noooste/garage-ui:v0.14.0@sha256:e4a33c448304a3f6e60f08d6aa71b2471fd79ac870a5c7e178ea247dea3238b3
    restart: unless-stopped
    depends_on: [garage]
    command: ["./garage-ui", "--config", "/app/config.yaml"]
    volumes:
      - ./garage-ui.yaml:/app/config.yaml:ro
      - ui-data:/app/data   # its session-signing key, generated on first start, kept across restarts
    networks: [garage]
    mem_limit: 128m

volumes:
  meta:
  data:
  ui-data:

networks:
  garage:
