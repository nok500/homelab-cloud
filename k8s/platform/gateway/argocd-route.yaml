---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: http
  hostnames:
    - argocd.lab.macpro
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
