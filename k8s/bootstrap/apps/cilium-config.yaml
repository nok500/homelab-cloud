---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nok500/homelab-cloud.git
    targetRevision: main
    path: k8s/platform/cilium-config
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
