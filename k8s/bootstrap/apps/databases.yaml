---
# The lab's "RDS": CNPG clusters + their backup target (k8s/platform/databases, ADR 0011).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: databases
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: git@github.com:nok500/homelab-cloud.git
    targetRevision: main
    path: k8s/platform/databases
  destination:
    server: https://kubernetes.default.svc
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true   # CRDs arrive with cnpg / cnpg-barman-plugin / external-secrets
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 2m}
