---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: step-ca
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://smallstep.github.io/helm-charts
      chart: step-certificates
      targetRevision: 1.30.1
      helm:
        releaseName: step-ca
        valueFiles:
          - $values/k8s/platform/step-ca/values.yaml
    - repoURL: git@github.com:nok500/homelab-cloud.git
      targetRevision: main
      ref: values
    # ca.json + public certs as the ConfigMaps the chart mounts (generated by scripts/pki-render.py)
    - repoURL: git@github.com:nok500/homelab-cloud.git
      targetRevision: main
      path: k8s/platform/step-ca/config
  destination:
    server: https://kubernetes.default.svc
    namespace: step-ca
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
