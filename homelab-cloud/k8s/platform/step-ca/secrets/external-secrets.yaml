---
# step-ca's secrets, from OpenBao secret/step-ca (seeded by OpenBao self-init, ADR 0008).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: step-ca-secrets
  namespace: step-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: step-ca-secrets
    template:
      type: smallstep.com/private-keys
  data:
    - secretKey: intermediate_ca_key
      remoteRef:
        key: step-ca
        property: intermediate_ca_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: step-ca-ca-password
  namespace: step-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: step-ca-ca-password
    template:
      type: smallstep.com/ca-password
  data:
    - secretKey: password
      remoteRef:
        key: step-ca
        property: ca_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: step-issuer-provisioner-password
  namespace: step-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: step-issuer-provisioner-password
    template:
      type: Opaque
  data:
    - secretKey: password
      remoteRef:
        key: step-ca
        property: provisioner_password
