---
# Every Secret Harbor's chart would otherwise generate, as ExternalSecrets from OpenBao secret/harbor/*
# (ADR 0013). The chart's random defaults use Helm `lookup`, which Argo CD doesn't run: left to the chart,
# each sync would mint new keys (broken sessions, a new token-signing CA, a new registry password).
# Key names are the ones the chart reads from each existingSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-core-ext   # core.existingSecret, existingSecretSecretKey, core.existingXsrfSecret, admin password
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-core-ext
  dataFrom:
    - extract:
        key: harbor/core
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-token   # core.secretName: the key pair core signs registry tokens with
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-token
    template:
      type: kubernetes.io/tls
  dataFrom:
    - extract:
        key: harbor/token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-jobservice-ext
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-jobservice-ext
  dataFrom:
    - extract:
        key: harbor/jobservice
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry-ext   # registry.existingSecret (HTTP secret) + registry.credentials.existingSecret
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-registry-ext
  dataFrom:
    - extract:
        key: harbor/registry
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-s3   # loaded whole into the registry's env (envFrom): only the two S3 keys
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-s3
  dataFrom:
    - extract:
        key: harbor/s3
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-db   # database.external.existingSecret (key: password)
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-db
  dataFrom:
    - extract:
        key: harbor/db
---
# Harbor's auth settings, applied by core at every start (CONFIG_OVERWRITE_JSON): OIDC through Keycloak.
# Lives here, not in the chart's configureUserSettings, because it carries the client secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-oidc-config
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-oidc-config
    template:
      data:
        CONFIG_OVERWRITE_JSON: |
          {"auth_mode": "oidc_auth",
           "oidc_name": "Keycloak",
           "oidc_endpoint": "https://sso.lab.macpro/realms/lab",
           "oidc_client_id": "harbor",
           "oidc_client_secret": "{{ .clientSecret }}",
           "oidc_scope": "openid,profile,email,groups",
           "oidc_groups_claim": "groups",
           "oidc_admin_group": "harbor-admins",
           "oidc_user_claim": "preferred_username",
           "oidc_verify_cert": true,
           "oidc_auto_onboard": true}
  dataFrom:
    - extract:
        key: harbor/oidc
