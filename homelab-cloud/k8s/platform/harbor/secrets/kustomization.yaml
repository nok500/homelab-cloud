---
# Harbor's Secrets (ADR 0013): ExternalSecrets from OpenBao, plus the lab root CA bundle (caBundleSecretName)
# so the registry trusts Garage (s3.lab.macpro) and core trusts Keycloak (sso.lab.macpro).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbor
resources:
  - external-secrets.yaml
secretGenerator:
  - name: harbor-ca
    files:
      - ca.crt=lab-root-ca.crt   # written by scripts/pki-render.py
    options:
      disableNameSuffixHash: true
