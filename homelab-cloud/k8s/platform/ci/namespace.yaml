---
# Pod Security: enforce `baseline`, warn + audit `restricted`. Everything here runs `restricted` except the build
# step: rootless BuildKit runs as uid 1000, unprivileged, but needs its Localhost seccomp profile and privilege
# escalation for newuidmap (rootlesskit's uid map), which `baseline` allows and `restricted` doesn't (ADR 0015).
apiVersion: v1
kind: Namespace
metadata:
  name: ci
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
