---
# Harbor login for the build pods: robot$ci+builder (terraform/identity), push + pull on project ci only.
# OpenBao secret/ci/harbor-robot, rendered as a Docker config (BuildKit reads $DOCKER_CONFIG/config.json).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-push
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-push
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths": {"registry.lab.macpro": {"auth": "{{ printf "%s:%s" .username .password | b64enc }}"}}}
        config.json: |
          {"auths": {"registry.lab.macpro": {"auth": "{{ printf "%s:%s" .username .password | b64enc }}"}}}
  dataFrom:
    - extract:
        key: ci/harbor-robot
