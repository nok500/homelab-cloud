---
# The monitoring stack's Secrets, as ExternalSecrets from OpenBao secret/monitoring/* (ADR 0014).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin   # grafana.admin.existingSecret: the local admin, break-glass next to Keycloak SSO
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: grafana-admin
  dataFrom:
    - extract:
        key: monitoring/grafana-admin
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc   # Keycloak client `grafana` (terraform/identity): read by Grafana as an env var
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: grafana-oidc
    template:
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .clientSecret }}"
  dataFrom:
    - extract:
        key: monitoring/grafana-oidc
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3   # Garage key for bucket loki, as the AWS SDK env vars Loki reads
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: loki-s3
  dataFrom:
    - extract:
        key: monitoring/loki-s3
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-ntfy   # Alertmanager's ntfy token (mounted as a file, alertmanagerSpec.secrets)
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: alertmanager-ntfy
    template:
      data:
        token: "{{ index . \"alertmanager-token\" }}"
  dataFrom:
    - extract:
        key: monitoring/ntfy
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-auth   # ntfy's declarative users, ACL and token (env vars of its server)
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: ntfy-auth
    template:
      data:
        NTFY_AUTH_USERS: >-
          labadmin:{{ index . "labadmin-hash" }}:user,alertmanager:{{ index . "alertmanager-hash" }}:user
        NTFY_AUTH_ACCESS: "labadmin:lab-alerts:ro,alertmanager:lab-alerts:wo"
        NTFY_AUTH_TOKENS: "alertmanager:{{ index . \"alertmanager-token\" }}:Alertmanager"
  dataFrom:
    - extract:
        key: monitoring/ntfy
