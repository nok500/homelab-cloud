---
# Demo database for the backup/restore test (make db-restore-test). Two instances, one per worker: the primary
# streams to a replica, so losing a worker's local-path volume isn't data loss (ADR 0006).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-demo
spec:
  instances: 2
  # Hibernation and switchovers stop PostgreSQL "smart" first: it waits for every client to disconnect.
  # Keycloak and Harbor keep their pools open, so the 180 s default ran out every make shutdown (2026-11-23).
  # After 15 s CNPG asks for a fast shutdown: open transactions roll back, still a clean checkpoint.
  smartShutdownTimeout: 15
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:b4bbd2e623f1a8833e9a2a4210480ef215b6d13fc0988b06786a778a5c699a20
  storage:
    size: 2Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required   # never both instances on one worker
  postgresql:
    parameters:
      archive_timeout: 5min        # a WAL segment at least every 5 min: the RPO when the DB is idle
  bootstrap:
    initdb:
      database: app
      owner: app
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-demo-daily
spec:
  schedule: "0 0 3 * * *"   # 03:00 daily (six fields: seconds first)
  immediate: true            # one base backup right after the cluster is created
  backupOwnerReference: self
  cluster:
    name: pg-demo
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
