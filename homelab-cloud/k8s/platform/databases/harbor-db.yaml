---
# Harbor's database (ADR 0013), built like pg-demo: two instances, one per worker, WAL + base backups to
# Garage under lab/harbor-db/. The owner's password comes from OpenBao (secret/databases/harbor-db), not
# from CNPG's generated app secret: Harbor runs in another namespace and reads the same value from
# secret/harbor/db, so no Secret has to be copied across namespaces.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-db-owner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: harbor-db-owner
    template:
      type: kubernetes.io/basic-auth   # the shape CNPG's initdb.secret expects
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: databases/harbor-db
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db
spec:
  instances: 2
  # Hibernation and switchovers stop PostgreSQL "smart" first: it waits for every client to disconnect.
  # Keycloak and Harbor keep their pools open, so the 180 s default ran out every make shutdown (2026-11-23).
  # After 15 s CNPG asks for a fast shutdown: open transactions roll back, still a clean checkpoint.
  smartShutdownTimeout: 15
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:b4bbd2e623f1a8833e9a2a4210480ef215b6d13fc0988b06786a778a5c699a20
  storage:
    size: 2Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required   # never both instances on one worker
  postgresql:
    parameters:
      archive_timeout: 5min
  bootstrap:
    initdb:
      database: registry
      owner: harbor
      secret:
        name: harbor-db-owner
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: harbor-db-daily
spec:
  schedule: "0 30 3 * * *"   # 03:30 daily, after keycloak-db's
  immediate: true
  backupOwnerReference: self
  cluster:
    name: harbor-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
