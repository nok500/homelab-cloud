---
# The lab's shared "ALB": one Cilium Gateway on a fixed LB IP. The home AdGuard has a single
# DNS rewrite *.lab.macpro -> 10.10.1.200 (ADR 0004); routing is by hostname from here on.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab
  namespace: gateway
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: 10.10.1.200
  listeners:
    # Port 80 only redirects to HTTPS (http-to-https.yaml); routes attach to `https`.
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.lab.macpro"
      allowedRoutes:
        namespaces:
          from: Same
    # TLS terminates here with the step-ca wildcard (k8s/platform/certificates, ADR 0007).
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lab.macpro"
      tls:
        mode: Terminate
        certificateRefs:
          - name: lab-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
