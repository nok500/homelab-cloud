---
# Keycloak instance, its route and Secrets (ADR 0012). No `namespace:` here on purpose: the Argo CD client
# secret lives in argocd, everything else in keycloak (set per resource).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - keycloak.yaml
  - httproute.yaml
  - argocd-oidc-secret.yaml
