---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: https
  hostnames:
    - sso.lab.macpro
  rules:
    - backendRefs:
        - name: keycloak-service   # created by the operator: <Keycloak name>-service
          port: 8080
