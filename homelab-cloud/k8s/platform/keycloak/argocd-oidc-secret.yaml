---
# Argo CD's OIDC client secret for Keycloak (OpenBao secret/argocd/oidc-keycloak; terraform/identity sets the
# same value on the client). Argo CD only resolves `$argocd-oidc-keycloak:clientSecret` in argocd-cm from
# Secrets labelled part-of: argocd.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-keycloak
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: argocd-oidc-keycloak
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        clientSecret: "{{ .clientSecret }}"
  dataFrom:
    - extract:
        key: argocd/oidc-keycloak
