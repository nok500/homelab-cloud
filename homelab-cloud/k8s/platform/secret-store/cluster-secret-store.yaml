---
# The one way into OpenBao. ESO authenticates with its own service account (OpenBao kubernetes auth, role
# `external-secrets`, read-only on secret/*). Who may USE the store is the allow-list below: a namespace must
# be added here (in Git, reviewed) before its ExternalSecrets resolve. OpenBao paths are per namespace
# (secret/<namespace>[/...]); Kyverno enforces that prefix in Phase 5 (ADR 0008).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  conditions:
    - namespaces:
        - step-ca
        - databases
        - keycloak   # Keycloak's DB login + bootstrap admin (ADR 0012)
        - argocd     # the Keycloak OIDC client secret only
        - harbor     # Harbor: its fixed keys, DB login, Garage key, OIDC client secret (ADR 0013)
        - monitoring # Grafana admin + OIDC client secret, Loki's Garage key, ntfy users and token (ADR 0014)
        - argo       # the Argo Workflows server's Keycloak OIDC client (ADR 0015)
        - ci         # the Harbor push robot for CI builds (ADR 0015)
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
