---
# OpenBao (Secrets Manager / KMS equivalent, ADR 0008). Single standalone instance on a local-path volume.
# Its data is rebuilt on every `make destroy && make up` (regenerate + seed): it auto-unseals with a static
# key and self-initializes from the `openbao-seed` Secret (seed.enc.yaml, SOPS), mounted at /openbao/seed.
injector:
  enabled: false
ui:
  enabled: true
server:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
  dataStorage:
    size: 1Gi
  volumes:
    - name: seed
      secret:
        secretName: openbao-seed
  volumeMounts:
    - name: seed
      mountPath: /openbao/seed
      readOnly: true
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        # in-cluster plain HTTP; browsers reach it via the Gateway's TLS (bao.lab.macpro)
        tls_disable     = 1
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "pebbledb" {
        path = "/openbao/data/pebbledb"
      }
      # Auto-unseal with a static key from the seed Secret (no Shamir ceremony after every rebuild).
      seal "static" {
        current_key_id = "lab-1"
        current_key    = "file:///openbao/seed/unseal.key"
      }

      # Declarative audit log to stdout (creating audit devices via the API is blocked by default)
      audit "file" "stdout" {
        description = "audit log to the pod log"
        options {
          file_path = "stdout"
        }
      }

      # ---- self-initialization: runs once, on first start with empty storage ----
      initialize "kv" {
        request "mount" {
          operation = "update"
          path      = "sys/mounts/secret"
          data      = { type = "kv", options = { version = "2" } }
        }
      }
      initialize "admin" {
        request "policy" {
          operation = "update"
          path      = "sys/policies/acl/admin"
          data = {
            policy = "path \"*\" { capabilities = [\"create\", \"read\", \"update\", \"delete\", \"list\", \"patch\", \"sudo\"] }"
          }
        }
        request "userpass" {
          operation = "update"
          path      = "sys/auth/userpass"
          data      = { type = "userpass" }
        }
        request "user" {
          operation = "update"
          path      = "auth/userpass/users/admin"
          data = {
            password       = { eval_type = "string", eval_source = "file", path = "/openbao/seed/admin-password" }
            token_policies = ["admin"]
          }
        }
      }
      initialize "external-secrets" {
        request "k8s-auth" {
          operation = "update"
          path      = "sys/auth/kubernetes"
          data      = { type = "kubernetes" }
        }
        request "k8s-config" {
          operation = "update"
          path      = "auth/kubernetes/config"
          data      = { kubernetes_host = "https://kubernetes.default.svc" }
        }
        # read everything under secret/, write only under secret/generated/ (PushSecret, later milestones)
        request "policy" {
          operation = "update"
          path      = "sys/policies/acl/external-secrets"
          data = {
            policy = <<-EOT
              path "secret/data/*"               { capabilities = ["read"] }
              path "secret/metadata/*"           { capabilities = ["read", "list"] }
              path "secret/data/generated/*"     { capabilities = ["create", "read", "update"] }
              path "secret/metadata/generated/*" { capabilities = ["read", "list", "update", "delete"] }
            EOT
          }
        }
        request "role" {
          operation = "update"
          path      = "auth/kubernetes/role/external-secrets"
          data = {
            bound_service_account_names      = ["external-secrets"]
            bound_service_account_namespaces = ["external-secrets"]
            token_policies                   = ["external-secrets"]
            token_ttl                        = "1h"
          }
        }
      }
      initialize "seed" {
        request "step-ca" {
          operation = "update"
          path      = "secret/data/step-ca"
          data = {
            data = {
              intermediate_ca_key   = { eval_type = "string", eval_source = "file", path = "/openbao/seed/step-ca-intermediate-key" }
              ca_password           = { eval_type = "string", eval_source = "file", path = "/openbao/seed/step-ca-ca-password" }
              provisioner_password  = { eval_type = "string", eval_source = "file", path = "/openbao/seed/step-ca-provisioner-password" }
            }
          }
        }
        # CNPG backups to Garage on the host (bucket cnpg-backups, ADR 0010/0011)
        request "databases" {
          operation = "update"
          path      = "secret/data/databases/garage-s3"
          data = {
            data = {
              ACCESS_KEY_ID     = { eval_type = "string", eval_source = "file", path = "/openbao/seed/databases-s3-access-key-id" }
              ACCESS_SECRET_KEY = { eval_type = "string", eval_source = "file", path = "/openbao/seed/databases-s3-secret-access-key" }
            }
          }
        }
        # Keycloak (ADR 0012). The DB password appears twice, once per consuming namespace (paths are per
        # namespace): CNPG creates the role with it, Keycloak logs in with it.
        request "keycloak-db-owner" {
          operation = "update"
          path      = "secret/data/databases/keycloak-db"
          data = {
            data = {
              username = "keycloak"
              password = { eval_type = "string", eval_source = "file", path = "/openbao/seed/keycloak-db-password" }
            }
          }
        }
        request "keycloak-db-client" {
          operation = "update"
          path      = "secret/data/keycloak/db"
          data = {
            data = {
              username = "keycloak"
              password = { eval_type = "string", eval_source = "file", path = "/openbao/seed/keycloak-db-password" }
            }
          }
        }
        request "keycloak-admin" {
          operation = "update"
          path      = "secret/data/keycloak/bootstrap-admin"
          data = {
            data = {
              username = "admin"
              password = { eval_type = "string", eval_source = "file", path = "/openbao/seed/keycloak-admin-password" }
            }
          }
        }
        # Harbor (ADR 0013): key names are the ones its chart reads from each existingSecret
        request "harbor-db-owner" {
          operation = "update"
          path      = "secret/data/databases/harbor-db"
          data = {
            data = {
              username = "harbor"
              password = { eval_type = "string", eval_source = "file", path = "/openbao/seed/harbor-db-password" }
            }
          }
        }
        request "harbor-db-client" {
          operation = "update"
          path      = "secret/data/harbor/db"
          data = {
            data = {
              password = { eval_type = "string", eval_source = "file", path = "/openbao/seed/harbor-db-password" }
            }
          }
        }
        request "harbor-core" {
          operation = "update"
          path      = "secret/data/harbor/core"
          data = {
            data = {
              secret                = { eval_type = "string", eval_source = "file", path = "/openbao/seed/harbor-core-secret" }
              secretKey             = { eval_type = "string", eval_source = "file", path = "/openbao/seed/harbor-secret-key" }
              CSRF_KEY              = { eval_type = "string", eval_source = "file", path = "/openbao/seed/harbor-csrf-key" }
              HARBOR_ADMIN_PASSWORD = { eval_type = "string", eval_source = "file", path = "/openbao/seed/harbor-admin-password" }
            }
          }
        }
        request "harbor-token" {
          operation = "update"
          path      = "secret/data/harbor/token"
          data = {
            data = {
              "tls.key" = { eval_type = "string", eval_source = "file", path = "/openbao/seed/harbor-token-key" }
              "tls.crt" = { eval_type = "string", eval_source = "file", path = "/openbao/seed/harbor-token-cert" }
            }
          }
        }
        request "harbor-jobservice" {
          operation = "update"
          path      = "secret/data/harbor/jobservice"
          data = {
            data = {
              JOBSERVICE_SECRET = { eval_type = "string", eval_source = "file", path = "/openbao/seed/harbor-jobservice-secret" }
            }
          }
        }
        request "harbor-registry" {
          operation = "update"
          path      = "secret/data/harbor/registry"
          data = {
            data = {
              REGISTRY_HTTP_SECRET = { eval_type = "string", eval_source = "file", path = "/openbao/seed/harbor-registry-http-secret" }
              REGISTRY_PASSWD      = { eval_type = "string", eval_source = "file", path = "/openbao/seed/harbor-registry-password" }
              REGISTRY_HTPASSWD    = { eval_type = "string", eval_source = "file", path = "/openbao/seed/harbor-registry-htpasswd" }
            }
          }
        }
        request "harbor-s3" {
          operation = "update"
          path      = "secret/data/harbor/s3"
          data = {
            data = {
              REGISTRY_STORAGE_S3_ACCESSKEY = { eval_type = "string", eval_source = "file", path = "/openbao/seed/harbor-s3-access-key-id" }
              REGISTRY_STORAGE_S3_SECRETKEY = { eval_type = "string", eval_source = "file", path = "/openbao/seed/harbor-s3-secret-access-key" }
            }
          }
        }
        request "harbor-oidc" {
          operation = "update"
          path      = "secret/data/harbor/oidc"
          data = {
            data = {
              clientSecret = { eval_type = "string", eval_source = "file", path = "/openbao/seed/keycloak-harbor-client-secret" }
            }
          }
        }
        request "argocd-oidc" {
          operation = "update"
          path      = "secret/data/argocd/oidc-keycloak"
          data = {
            data = {
              clientSecret = { eval_type = "string", eval_source = "file", path = "/openbao/seed/keycloak-argocd-client-secret" }
            }
          }
        }
        # observability (ADR 0014)
        request "monitoring-grafana-admin" {
          operation = "update"
          path      = "secret/data/monitoring/grafana-admin"
          data = {
            data = {
              admin-user     = "admin"
              admin-password = { eval_type = "string", eval_source = "file", path = "/openbao/seed/monitoring-grafana-admin-password" }
            }
          }
        }
        request "monitoring-grafana-oidc" {
          operation = "update"
          path      = "secret/data/monitoring/grafana-oidc"
          data = {
            data = {
              clientSecret = { eval_type = "string", eval_source = "file", path = "/openbao/seed/keycloak-grafana-client-secret" }
            }
          }
        }
        request "monitoring-loki-s3" {
          operation = "update"
          path      = "secret/data/monitoring/loki-s3"
          data = {
            data = {
              AWS_ACCESS_KEY_ID     = { eval_type = "string", eval_source = "file", path = "/openbao/seed/monitoring-loki-s3-access-key-id" }
              AWS_SECRET_ACCESS_KEY = { eval_type = "string", eval_source = "file", path = "/openbao/seed/monitoring-loki-s3-secret-access-key" }
            }
          }
        }
        request "monitoring-ntfy" {
          operation = "update"
          path      = "secret/data/monitoring/ntfy"
          data = {
            data = {
              alertmanager-token = { eval_type = "string", eval_source = "file", path = "/openbao/seed/monitoring-ntfy-alertmanager-token" }
              labadmin-password  = { eval_type = "string", eval_source = "file", path = "/openbao/seed/monitoring-ntfy-labadmin-password" }
              labadmin-hash      = { eval_type = "string", eval_source = "file", path = "/openbao/seed/monitoring-ntfy-labadmin-hash" }
              alertmanager-hash  = { eval_type = "string", eval_source = "file", path = "/openbao/seed/monitoring-ntfy-alertmanager-hash" }
            }
          }
        }
      }
