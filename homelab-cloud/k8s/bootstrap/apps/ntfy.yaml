---
# ntfy v2.38.1, the alert webhook (k8s/platform/ntfy, ADR 0014): https://ntfy.lab.macpro, topic lab-alerts.
# Its users/ACL/token Secret comes with monitoring (wave 2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntfy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: git@github.com:nok500/lab.git
    targetRevision: main
    path: homelab-cloud/k8s/platform/ntfy
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true   # ServiceMonitor CRD arrives with monitoring
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 2m}
