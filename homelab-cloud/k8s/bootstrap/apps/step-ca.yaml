---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: step-ca
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://smallstep.github.io/helm-charts
      chart: step-certificates
      targetRevision: 1.30.1
      helm:
        releaseName: step-ca
        valueFiles:
          - $values/homelab-cloud/k8s/platform/step-ca/values.yaml
    - repoURL: git@github.com:nok500/lab.git
      targetRevision: main
      ref: values
    # ca.json + public certs as the ConfigMaps the chart mounts (generated by scripts/pki-render.py)
    - repoURL: git@github.com:nok500/lab.git
      targetRevision: main
      path: homelab-cloud/k8s/platform/step-ca/config
    # its Secrets, as ExternalSecrets from OpenBao
    - repoURL: git@github.com:nok500/lab.git
      targetRevision: main
      path: homelab-cloud/k8s/platform/step-ca/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: step-ca
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true   # ExternalSecret CRD arrives with external-secrets
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 2m}
