---
# Observability, the lab's CloudWatch (k8s/platform/monitoring, ADR 0014): kube-prometheus-stack 93.1.1
# (Prometheus, Alertmanager, Grafana, node-exporter, kube-state-metrics), plus its Secrets, Argo CD's
# ServiceMonitors and dashboards. Wave 2: needs cert-manager (webhook cert) and External Secrets; Keycloak
# only at login time.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.1.1
      helm:
        releaseName: kps
        valueFiles:
          - $values/homelab-cloud/k8s/platform/monitoring/values.yaml
    - repoURL: git@github.com:nok500/lab.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:nok500/lab.git
      targetRevision: main
      path: homelab-cloud/k8s/platform/monitoring/extras
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # cert-manager's CA injector fills in the webhooks' caBundle after Argo CD applied them
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[].clientConfig.caBundle']
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[].clientConfig.caBundle']
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # node-exporter needs the host's network, PID namespace and /proc + /sys: Pod Security "privileged" here
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true                # the Prometheus Operator CRDs are too big for client-side apply
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true    # ExternalSecret / ServiceMonitor CRDs may arrive in the same sync
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 2m}
