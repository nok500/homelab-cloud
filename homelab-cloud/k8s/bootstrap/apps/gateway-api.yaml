---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: git@github.com:nok500/lab.git
    targetRevision: main
    path: homelab-cloud/k8s/platform/gateway-api
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false # never delete CRDs (and every Gateway/Route with them) automatically
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
