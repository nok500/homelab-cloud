---
# Grafana Alloy v1.22.0 (chart 1.16.0): pod logs + Kubernetes events to Loki (k8s/platform/alloy, ADR 0014).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.16.0
      helm:
        releaseName: alloy
        valueFiles:
          - $values/homelab-cloud/k8s/platform/alloy/values.yaml
    - repoURL: git@github.com:nok500/lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true   # ServiceMonitor CRD arrives with monitoring (wave 2)
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 2m}
