---
# Loki 3.7.10 (grafana-community chart 21.2.3), logs on Garage S3 (k8s/platform/loki, ADR 0014).
# After monitoring (wave 2), whose ExternalSecret delivers its Garage key.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 21.2.3
      helm:
        releaseName: loki
        valueFiles:
          - $values/homelab-cloud/k8s/platform/loki/values.yaml
    - repoURL: git@github.com:nok500/lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true   # ServiceMonitor CRD arrives with monitoring (wave 2)
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 2m}
