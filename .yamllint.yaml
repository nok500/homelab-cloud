---
extends: default
ignore: |
  .tools/
  **/.terraform/
  **/charts/
  # machine-written: SOPS output and generated PKI manifests (base64 bundles on one line)
  *.enc.yaml
  homelab-cloud/k8s/platform/certificates/step-cluster-issuer.yaml
rules:
  line-length:
    max: 160
    level: warning
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  document-start:
    present: true
